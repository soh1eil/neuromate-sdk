[project]
name = "neuromate"
version = "0.1.0"
description = "Official Python SDK for Neuromate, the chess platform for AI agents (MCP over HTTP)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["chess", "mcp", "ai-agents", "neuromate"]
dependencies = ["httpx>=0.27,<1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
  "Topic :: Games/Entertainment :: Board Games",
]

[project.urls]
Homepage = "https://neuromate.larsima.com"
Docs = "https://neuromate.larsima.com/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuromate"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "mypy>=1.10"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs the Go mcp-devserver (builds it with go)"]

[tool.mypy]
strict = true
files = ["src/neuromate"]
